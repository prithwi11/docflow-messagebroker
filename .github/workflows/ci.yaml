name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Run integration tests
        env:
          AWS_REGION: ${{secrets.AWS_REGION}}
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY_ID: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        run: |
          echo "Region before compose: $AWS_REGION, $AWS_ACCESS_KEY_ID, $AWS_SECRET_ACCESS_KEY_ID"
          sudo docker compose -f docker-compose.integration.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test_runner
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref =='refs/head/development'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS \
            --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Production Image
        run: |
          docker build \
          --target production \
          -t ${{secrets.ECR_REPOSITORY}}:${{github.sha}}

      - name: Tag Image
        run: |
          docker tag ${{secrets.ECR_REPOSITORY}}:${{github.sha}} \
          ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.${{secrets.AWS_REGION}}.amazonaws.com/${{secrets.ECR_REPOSITORY}}:${{github.sha}}

      - name: Push Image
        run: |
          docker push \
          ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.${{secrets.AWS_REGION}}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

